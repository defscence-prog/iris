<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
:root{
  --bg:#f4f6fa;--white:#fff;--border:#e9ebf1;--border2:#d6dae2;--text:#101828;--text2:#344054;--muted:#667085;
  --red:#c8102e;--red-dark:#a20d24;--green:#17a06a;--green-dark:#0e7d52;--green-tint:#e4f6ee;--menu-w:300px;
  --ok:#17a06a;--ok-bg:#e4f6ee;--ok-border:#9fe1cb;
  --pend:#c96a1e;--pend-bg:#fff4e8;--pend-border:#f7c98a;
  --na:#727d90;--na-bg:#f1f3f7;--na-border:#e2e6ee;
  --shadow-sm:0 1px 2px rgba(16,24,40,.05);
  --shadow:0 1px 3px rgba(16,24,40,.07),0 1px 2px rgba(16,24,40,.04);
  --shadow-md:0 14px 32px rgba(16,24,40,.13),0 4px 10px rgba(16,24,40,.06);
  --radius:16px;
  --ease-out:cubic-bezier(0.23,1,0.32,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:'Inter',sans-serif;background:linear-gradient(158deg,#ace4cd 0%,#b2d9e0 50%,#bdd6f1 100%) fixed;color:var(--text);padding-top:64px;padding-bottom:60px;line-height:1.45;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
::selection{background:rgba(0,149,76,.16)}
:focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:6px}
button:focus:not(:focus-visible),select:focus:not(:focus-visible),input:focus:not(:focus-visible){outline:none}
*::-webkit-scrollbar{width:11px;height:11px}
*::-webkit-scrollbar-thumb{background:#cdd3dd;border-radius:99px;border:3px solid transparent;background-clip:content-box}
*::-webkit-scrollbar-thumb:hover{background:#b4bcc8;background-clip:content-box}
.tb-pct,.dash-stat-num,.sb-store .pc,.prog-line b,.sb-global .pct,.hist-table td.dt{font-variant-numeric:tabular-nums}
h1,.chart-title,.store-head h1,.modal-title{letter-spacing:-0.02em}
.topbar{position:fixed;top:0;left:0;right:0;z-index:50;background:rgba(255,255,255,.9);backdrop-filter:saturate(180%) blur(12px);-webkit-backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--border);height:64px;display:flex;align-items:center;padding:0 14px;gap:12px}
.hamb{width:42px;height:42px;border:1px solid var(--border);background:var(--white);border-radius:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s ease,border-color .15s ease}
.hamb:hover{background:var(--bg);border-color:var(--border2)}
.hamb span{display:block;width:18px;height:2px;background:var(--text);position:relative}
.hamb span:before,.hamb span:after{content:'';position:absolute;left:0;width:18px;height:2px;background:var(--text)}
.hamb span:before{top:-6px}.hamb span:after{top:6px}
.topbar img{height:34px;object-fit:contain}
.topbar .title{font-weight:800;font-size:0.9rem;flex:1;line-height:1.1}
.topbar .title span{display:block;font-weight:500;font-size:0.66rem;color:var(--muted)}
.tb-btn{border:1px solid var(--border);background:var(--white);color:var(--green-dark);font-weight:700;font-size:0.72rem;padding:7px 12px;border-radius:99px;cursor:pointer;flex-shrink:0;transition:background .15s ease,border-color .15s ease}
.tb-btn:hover{background:var(--bg);border-color:var(--border2)}
.tb-pct{background:var(--green);color:#fff;font-weight:800;font-size:0.78rem;padding:7px 13px;border-radius:99px;flex-shrink:0;box-shadow:0 2px 8px rgba(0,149,76,.28)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:90;opacity:0;pointer-events:none;transition:opacity 0.3s}
.overlay.show{opacity:1;pointer-events:auto}
.sidebar{position:fixed;top:0;left:calc(-1 * var(--menu-w) - 10px);width:var(--menu-w);height:100vh;background:var(--white);z-index:100;transition:left 0.35s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;box-shadow:var(--shadow-md)}
.sidebar.show{left:0}
.sb-head{padding:16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.sb-head img{height:34px}
.sb-head b{font-size:0.9rem;font-weight:800}
.sb-head small{display:block;font-size:0.66rem;color:var(--muted);font-weight:500}
.sb-global{padding:14px 16px;border-bottom:1px solid var(--border);background:var(--bg)}
.sb-global .lbl{font-size:0.68rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.4px;margin-bottom:6px}
.sb-global .barw{height:9px;background:#e5e9f0;border-radius:99px;overflow:hidden}
.sb-global .bar{height:100%;background:var(--green);border-radius:99px;width:0;transition:width 0.4s}
.sb-global .pct{font-size:1.1rem;font-weight:800;color:var(--green-dark);margin-top:4px}
.sb-list{flex:1;overflow-y:auto;padding:8px}
.sb-store{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;cursor:pointer;margin-bottom:2px}
.sb-store:hover{background:var(--bg)}
.sb-store.active{background:var(--green-tint);box-shadow:inset 3px 0 0 var(--green)}
.sb-store.done .pc{color:var(--green)}
.sb-store .nm{flex:1;font-weight:700;font-size:0.86rem;color:var(--text)}
.sb-store .nm small{display:block;font-weight:500;font-size:0.68rem;color:var(--muted)}
.sb-store .pc{font-weight:800;font-size:0.82rem;color:var(--green-dark)}
.sb-actions{padding:10px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:6px}
.sb-actions button{width:100%;padding:11px 13px;border-radius:11px;border:1px solid var(--ok-border);background:var(--green-tint);color:var(--green-dark);font-family:'Inter',sans-serif;font-weight:700;font-size:0.82rem;cursor:pointer;text-align:left;transition:background .15s ease}
.sb-actions button:hover{background:#dcf2e6}
.wrap{max-width:780px;margin:0 auto;padding:16px}
.store-head{position:relative;overflow:hidden;isolation:isolate;background:linear-gradient(135deg,#1fbe83 0%,#12a06a 55%,#0c7d54 100%);color:#fff;border:none;border-radius:20px;padding:22px;margin-bottom:14px;box-shadow:0 12px 30px rgba(0,110,55,.28)}
.store-head::before{content:"";position:absolute;left:-15%;right:-15%;top:-60%;height:220%;z-index:-1;background:radial-gradient(45% 45% at 25% 30%,rgba(255,255,255,.22),transparent 70%),radial-gradient(40% 40% at 85% 15%,rgba(245,162,90,.30),transparent 70%),radial-gradient(50% 50% at 70% 90%,rgba(255,255,255,.10),transparent 70%);background-size:180% 180%;transform:translateY(var(--par,0px));animation:heroShift 16s ease-in-out infinite;pointer-events:none;will-change:transform,background-position}
@keyframes heroShift{0%,100%{background-position:0% 20%,100% 0%,50% 100%}50%{background-position:35% 60%,60% 40%,40% 70%}}
@media (prefers-reduced-motion:reduce){.store-head::before{animation:none}}
.store-head h1{font-size:1.5rem;font-weight:800;margin-bottom:4px;color:#fff}
.store-head .sh-sub{font-size:0.79rem;color:rgba(255,255,255,.85);margin-bottom:12px}
.prog-wrap{height:12px;background:rgba(255,255,255,.24);border-radius:99px;overflow:hidden}
.prog-bar{height:100%;background:#fff;border-radius:99px;transition:width 0.4s ease;width:0}
.prog-line{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.prog-line span{color:rgba(255,255,255,.85)!important}
.prog-line b{font-size:1.15rem;color:#fff}
.addbar{background:var(--white);border-radius:14px;padding:12px;box-shadow:var(--shadow-sm);border:1px solid var(--border);margin-bottom:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.addbar select{flex:1;min-width:150px;padding:10px;border:1px solid var(--border2);border-radius:9px;font-family:'Inter',sans-serif;font-size:0.82rem;font-weight:600;background:#fff}
.addbar .add-btn{padding:10px 14px;border:none;border-radius:9px;background:var(--green);color:#fff;font-family:'Inter',sans-serif;font-weight:700;font-size:0.8rem;cursor:pointer}
.addbar .new-btn{padding:10px 12px;border:1px solid var(--border);border-radius:9px;background:var(--bg);color:var(--green-dark);font-family:'Inter',sans-serif;font-weight:700;font-size:0.8rem;cursor:pointer}
.cat-title{font-size:0.72rem;font-weight:800;text-transform:uppercase;letter-spacing:0.5px;color:var(--muted);margin:18px 4px 8px}
.act-card{background:var(--white);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow-sm);border:1px solid var(--border);margin-bottom:10px;position:relative;transition:border-color .15s ease,background .15s ease}
.act-card.st-realizado{background:var(--ok-bg);border-color:var(--ok-border)}
.act-card.st-na{background:var(--na-bg);border-color:var(--na-border);opacity:0.78}
.act-name{font-weight:700;font-size:0.92rem;margin-bottom:10px;padding-right:26px;letter-spacing:-0.01em;color:var(--text)}
.rm-btn{position:absolute;top:12px;right:12px;width:22px;height:22px;border:none;background:var(--na-bg);color:var(--muted);border-radius:50%;font-size:0.85rem;cursor:pointer;line-height:1}
.act-btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.ab{padding:11px 4px;border-radius:11px;border:1px solid var(--border2);background:#fff;font-family:'Inter',sans-serif;font-weight:700;font-size:0.72rem;cursor:pointer;color:var(--muted);text-align:center;box-shadow:var(--shadow-sm);transition:background .15s ease,color .15s ease,border-color .15s ease,box-shadow .15s ease,transform .1s ease}
.ab:hover{border-color:#c3c9d3}
.ab:active{transform:scale(0.97)}
.ab.ok.active{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}
.ab.pend.active{background:var(--pend-bg);border-color:var(--pend);color:var(--pend);box-shadow:inset 0 0 0 1px var(--pend)}
.ab.na.active{background:var(--na-bg);border-color:var(--na);color:var(--na);box-shadow:inset 0 0 0 1px var(--na)}
.obs-toggle{margin-top:8px;font-size:0.7rem;color:var(--green-dark);font-weight:700;cursor:pointer;user-select:none}
.obs-area{margin-top:8px;display:none}
.obs-area.show{display:block}
.obs-area textarea{width:100%;border:1px solid var(--border);border-radius:9px;padding:9px;font-family:'Inter',sans-serif;font-size:0.82rem;resize:vertical;min-height:52px}
.empty{background:var(--white);border-radius:14px;padding:30px 20px;text-align:center;color:var(--muted);font-size:0.85rem;box-shadow:var(--shadow-sm);border:1px dashed var(--border2)}
.dash-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px}
.dash-stat{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:16px 14px;text-align:center}
.dash-stat.ok{background:var(--ok-bg);border-color:var(--ok-border)}
.dash-stat.pend{background:var(--pend-bg);border-color:var(--pend-border)}
.dash-stat-num{font-size:1.75rem;font-weight:800;letter-spacing:-0.02em;color:var(--text)}
.dash-stat.ok .dash-stat-num{color:var(--ok)}
.dash-stat.pend .dash-stat-num{color:var(--pend)}
.dash-stat-label{font-size:0.66rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.4px;font-weight:600;margin-top:2px}
.chart-card{background:var(--white);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow-sm);border:1px solid var(--border);margin-bottom:14px}
.chart-title{font-weight:800;font-size:0.95rem;margin-bottom:12px;color:var(--text)}
.rank-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
.rank-row:last-child{border-bottom:none}
.rank-name{flex:1;font-weight:600;font-size:0.86rem}
.rank-bar-track{flex:1.2;height:8px;background:var(--bg);border-radius:99px;overflow:hidden}
.rank-bar{height:100%;border-radius:99px}
.rank-val{font-size:0.78rem;font-weight:700;min-width:52px;text-align:right}
.back-btn{width:100%;padding:13px;border-radius:12px;border:1px solid var(--border);background:var(--white);color:var(--muted);font-family:'Inter',sans-serif;font-weight:700;font-size:0.85rem;cursor:pointer;margin-top:8px}
.hist-table{width:100%;border-collapse:collapse;font-size:0.72rem}
.hist-table th{text-align:left;padding:7px 8px;background:var(--bg);color:var(--muted);font-weight:700;border-bottom:2px solid var(--border);white-space:nowrap}
.hist-table td{padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:top}
.hist-table td.dt{white-space:nowrap;color:var(--muted)}
.hb{display:inline-block;padding:2px 7px;border-radius:99px;font-weight:700;font-size:0.65rem;white-space:nowrap}
.hb.r{background:var(--ok-bg);color:var(--ok)}
.hb.p{background:var(--pend-bg);color:var(--pend)}
.hb.n{background:var(--na-bg);color:var(--na)}
.mini-btn{padding:9px 12px;border:none;border-radius:9px;font-family:'Inter',sans-serif;font-weight:700;font-size:0.78rem;cursor:pointer}
.modal-ov{position:fixed;inset:0;background:rgba(15,23,42,0.6);z-index:400;display:flex;align-items:center;justify-content:center;padding:20px}
.modal-box{background:#fff;border-radius:18px;padding:24px;max-width:370px;width:100%;box-shadow:var(--shadow-md)}
.modal-title{font-weight:800;font-size:1.1rem;margin-bottom:6px}
.modal-sub{font-size:0.82rem;color:var(--muted);margin-bottom:16px;line-height:1.4}
.modal-lbl{display:block;font-size:0.72rem;font-weight:700;color:var(--muted);margin-bottom:6px}
.modal-inp{width:100%;box-sizing:border-box;padding:11px;border:1px solid var(--border2);border-radius:10px;font-family:'Inter',sans-serif;font-size:1rem;margin-bottom:16px}
.modal-btns{display:flex;gap:10px}
.modal-btns button{flex:1;padding:12px;border-radius:10px;font-family:'Inter',sans-serif;font-weight:700;font-size:0.88rem;cursor:pointer;border:none}
.modal-cancel{background:var(--bg);color:var(--muted);border:1px solid var(--border)!important}
.modal-ok{background:var(--green);color:#fff}
.toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--text);color:#fff;border-radius:99px;padding:11px 22px;font-size:0.78rem;z-index:300;transition:transform 0.3s;white-space:nowrap;box-shadow:var(--shadow-md);pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0)}
.pill{position:fixed;bottom:14px;right:14px;z-index:9999;border:none;color:#fff;padding:9px 13px;border-radius:22px;font-family:'Inter',sans-serif;font-weight:700;font-size:0.74rem;box-shadow:0 4px 14px rgba(0,0,0,0.25)}

/* ===== Animaciones (entrada del modal + menú lateral) ===== */
/* Modal de registro: aparece de vez en cuando -> entrada estándar */
.modal-ov{transition:opacity .2s ease}
.modal-ov .modal-box{transition:transform .28s var(--ease-out),opacity .28s ease}
@starting-style{
  .modal-ov{opacity:0}
  .modal-ov .modal-box{opacity:0;transform:scale(.96)}
}
/* Tiendas del menú lateral: entran escalonadas al abrir el menú */
.sb-list .sb-store{transition:opacity .32s ease,transform .32s var(--ease-out)}
@starting-style{ .sb-list .sb-store{opacity:0;transform:translateX(-14px)} }
.sb-list .sb-store:nth-child(1){transition-delay:.00s}
.sb-list .sb-store:nth-child(2){transition-delay:.04s}
.sb-list .sb-store:nth-child(3){transition-delay:.08s}
.sb-list .sb-store:nth-child(4){transition-delay:.12s}
.sb-list .sb-store:nth-child(5){transition-delay:.16s}
.sb-list .sb-store:nth-child(6){transition-delay:.20s}
.sb-list .sb-store:nth-child(7){transition-delay:.24s}
.sb-list .sb-store:nth-child(8){transition-delay:.28s}
.sb-list .sb-store:nth-child(n+9){transition-delay:.30s}
/* Respeta a quien pide menos movimiento: se mantiene el fundido, se quita el desplazamiento */
@media (prefers-reduced-motion:reduce){
  .modal-ov .modal-box{transition:opacity .2s ease}
  .sb-list .sb-store{transition:opacity .25s ease}
  @starting-style{
    .modal-ov .modal-box{transform:none}
    .sb-list .sb-store{transform:none}
  }
}
/* ===== Efecto cristal (glass) en zonas de lucimiento ===== */
.chart-card,.addbar,.empty{
  background:rgba(255,255,255,.60);
  backdrop-filter:blur(13px) saturate(150%);
  -webkit-backdrop-filter:blur(13px) saturate(150%);
  border:1px solid rgba(255,255,255,.6);
  box-shadow:0 8px 26px rgba(16,40,80,.14);
}
.sidebar{
  background:rgba(255,255,255,.72);
  backdrop-filter:blur(18px) saturate(160%);
  -webkit-backdrop-filter:blur(18px) saturate(160%);
}
.cat-title{color:rgba(255,255,255,.96);text-shadow:0 1px 3px rgba(0,40,30,.28)}
</style>
</head>

/* ====================== ESTADO ====================== */
var STATE_KEY='kkmant_state_v6';
var cid=1;
function baseItems(sid){
  var arr=[];
  (PRELOAD[sid]||[]).forEach(function(e){
    if(typeof e==='string'){ var a=ACT_BY_ID[e]; if(a) arr.push({key:e,name:a.name,cat:a.cat,st:'pendiente',obs:''}); }
    else{ arr.push({key:'c'+(cid++)+'_'+Date.now(),name:e.n,cat:e.c||'Letreros / Otros',st:'pendiente',obs:''}); }
  });
  return arr;
}
// Cada tienda arranca con su lista base (tareas reales precargadas)
function defaultState(){ var st={}; STORES.forEach(function(s){ st[s.id]=baseItems(s.id); }); return st; }
// Firebase puede borrar arrays vacíos o devolverlos como objetos: normalizamos siempre.
function toArray(v){ if(Array.isArray(v)) return v; if(v&&typeof v==='object'){ var a=[]; Object.keys(v).forEach(function(k){ a.push(v[k]); }); return a; } return []; }
function normalizeState(st){ st=st||{}; STORES.forEach(function(s){ st[s.id]=toArray(st[s.id]); }); return st; }
function loadState(){ try{ var v=localStorage.getItem(STATE_KEY); if(v) return normalizeState(JSON.parse(v)); }catch(e){} return defaultState(); }
var state=loadState();
function saveState(){ try{ localStorage.setItem(STATE_KEY,JSON.stringify(state)); }catch(e){} }

var HIST_KEY='kkmant_hist_v1';
function loadHist(){ try{ var v=localStorage.getItem(HIST_KEY); if(v) return JSON.parse(v); }catch(e){} return []; }
function saveHist(){ try{ localStorage.setItem(HIST_KEY,JSON.stringify(historial)); }catch(e){} }
var historial=loadHist();

var currentStore=STORES[0].id;
var currentView='store';
var openObs={};

/* Registrar el mantenimiento de una tienda: guarda foto con fecha en el historial y limpia la tienda */
// Registra SOLO las actividades marcadas Realizado, con la fecha que elija el usuario.
// Las registradas se archivan en el Historial y se quitan de la tienda; las pendientes quedan.
function registrarTienda(sid){
  var hechas=(state[sid]||[]).filter(function(it){return it.st==='realizado';});
  if(hechas.length===0){ showToast('Marcá al menos una actividad como ✅ Realizado'); return; }
  var hoy=new Date().toISOString().slice(0,10);
  var ov=document.createElement('div');
  ov.className='modal-ov';
  ov.innerHTML='<div class="modal-box">'+
    '<div class="modal-title">Registrar mantenimiento</div>'+
    '<div class="modal-sub"><b>'+esc(storeName(sid))+'</b><br>Se van a registrar <b>'+hechas.length+'</b> actividad(es) realizada(s). Las pendientes quedan para otro día.</div>'+
    '<label class="modal-lbl">Fecha del mantenimiento</label>'+
    '<input type="date" id="regFecha" class="modal-inp" value="'+hoy+'" max="'+hoy+'">'+
    '<div class="modal-btns"><button class="modal-cancel" onclick="cerrarModal()">Cancelar</button><button class="modal-ok" onclick="confirmarRegistro(\''+sid+'\')">Registrar</button></div>'+
  '</div>';
  document.body.appendChild(ov); window._modal=ov;
}
function cerrarModal(){ if(window._modal){ document.body.removeChild(window._modal); window._modal=null; } }
function confirmarRegistro(sid){
  var inp=document.getElementById('regFecha');
  var fechaIso=(inp&&inp.value)?inp.value:new Date().toISOString().slice(0,10);
  var hechas=(state[sid]||[]).filter(function(it){return it.st==='realizado';});
  if(hechas.length===0){ cerrarModal(); return; }
  var d=new Date(fechaIso+'T12:00:00'), now=new Date();
  historial.push({
    id:'h'+now.getTime(),
    fecha:fechaIso,
    fechaLbl:d.toLocaleDateString('es-PA'),
    hora:now.toLocaleTimeString('es-PA',{hour:'2-digit',minute:'2-digit'}),
    storeId:sid, storeName:storeName(sid),
    resumen:{real:hechas.length,pend:0,na:0,apl:hechas.length,pct:100},
    items:hechas.map(function(it){ return {name:it.name,cat:it.cat,st:'realizado',obs:it.obs}; })
  });
  saveHist();
  // quitar del activo solo las realizadas; el resto (pendientes / no aplica) queda
  state[sid]=(state[sid]||[]).filter(function(it){ return it.st!=='realizado'; });
  saveState();
  cerrarModal();
  renderStore();
  showToast(hechas.length+' actividad(es) registrada(s) ✓');
}
function storeName(sid){ var s=STORES.filter(function(x){return x.id===sid;})[0]; return s?s.name:sid; }
/* Recarga la lista base (tareas precargadas) de una tienda */
function cargarPrecarga(sid){
  state[sid]=baseItems(sid);
  saveState(); renderStore(); showToast('Lista base cargada');
}

/* ====================== HELPERS ====================== */
function storeProgress(sid){
  var items=state[sid]||[]; var apl=0,real=0,pend=0,na=0;
  items.forEach(function(it){ if(it.st==='na'){na++;return;} apl++; if(it.st==='realizado')real++; else pend++; });
  return {tot:items.length,apl:apl,real:real,pend:pend,na:na,pct:apl>0?Math.round(real/apl*100):0};
}
// Suma de lo REGISTRADO en el historial para una tienda
function histForStore(sid){
  var real=0,pend=0,na=0,regs=0;
  historial.forEach(function(h){ if(h.storeId===sid){ regs++; (h.items||[]).forEach(function(it){ if(it.st==='realizado')real++; else if(it.st==='na')na++; else pend++; }); } });
  return {real:real,pend:pend,na:na,regs:regs};
}
// Acumulado = estado MÁS RECIENTE de cada actividad (activo primero, luego historial de más nuevo a más viejo).
// Cada actividad se cuenta UNA sola vez, con su último estado (no se suman versiones viejas).
function storeAccumulated(sid){
  var seen={}, real=0,pend=0,na=0;
  function tally(it){ var k=(it.name||'').trim().toLowerCase(); if(!k||seen[k]) return; seen[k]=1; if(it.st==='realizado')real++; else if(it.st==='na')na++; else pend++; }
  (state[sid]||[]).forEach(tally); // lo activo = lo más reciente
  historial.slice().reverse().forEach(function(h){ if(h.storeId===sid){ (h.items||[]).forEach(tally); } }); // historial: más nuevo primero
  var apl=real+pend;
  return {real:real,pend:pend,na:na,apl:apl,regs:histForStore(sid).regs,pct:apl>0?Math.round(real/apl*100):0};
}
function globalProgress(){
  var apl=0,real=0,pend=0;
  STORES.forEach(function(s){ var p=storeAccumulated(s.id); apl+=p.apl; real+=p.real; pend+=p.pend; });
  return {apl:apl,real:real,pend:pend,pct:apl>0?Math.round(real/apl*100):0};
}
function esc(t){ return (''+t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* ====================== MENU ====================== */
function openMenu(){ document.getElementById('sidebar').classList.add('show'); document.getElementById('overlay').classList.add('show'); renderSidebar(); }
function closeMenu(){ document.getElementById('sidebar').classList.remove('show'); document.getElementById('overlay').classList.remove('show'); }
function renderSidebar(){
  var g=globalProgress();
  document.getElementById('sgBar').style.width=g.pct+'%';
  document.getElementById('sgPct').textContent=g.pct+'%';
  document.getElementById('topPct').textContent=g.pct+'%';
  var c=document.getElementById('sbList'); c.innerHTML='';
  STORES.forEach(function(s){
    var p=storeAccumulated(s.id);
    var done=p.apl>0&&p.pend===0;
    var d=document.createElement('div');
    d.className='sb-store'+(currentView==='store'&&currentStore===s.id?' active':'')+(done?' done':'');
    d.onclick=function(){ selectStore(s.id); };
    d.innerHTML='<div class="nm">'+s.name+'</div>'+
      '<div class="pc">'+(p.apl>0?p.pct+'%':'—')+'</div>';
    c.appendChild(d);
  });
}

/* ====================== VISTA TIENDA ====================== */
function renderStore(){
  var sid=currentStore;
  var store=STORES.filter(function(s){return s.id===sid;})[0];
  var items=state[sid]||[];
  var p=storeProgress(sid);
  var html='';
  var h=histForStore(sid);
  html+='<div class="store-head">'+
    '<h1>'+store.name+'</h1>'+
    '<div class="sh-sub">Sesión actual: '+p.real+' realizadas · '+p.pend+' pendientes · '+p.na+' no aplican</div>'+
    (h.regs>0?'<div style="font-size:0.72rem;color:rgba(255,255,255,.92);font-weight:700;margin-bottom:10px;display:inline-block;background:rgba(255,255,255,.16);padding:3px 9px;border-radius:99px">🗂️ En historial: '+h.real+' realizadas · '+h.regs+' registro(s)</div>':'')+
    '<div class="prog-line"><span style="font-size:0.78rem;color:var(--muted)">Avance de la sesión (sobre las que aplican)</span><b>'+p.pct+'%</b></div>'+
    '<div class="prog-wrap"><div class="prog-bar" id="pbar"></div></div>'+
  '</div>';

  if(items.length>0){
    html+='<div class="chart-card"><div class="chart-title">Estado de '+esc(store.name)+'</div>'+
      '<div style="position:relative;height:210px"><canvas id="chStore"></canvas></div></div>';
  }

  // barra para agregar actividad
  var usados={}; items.forEach(function(it){ usados[it.key]=1; });
  var esFabrica=(sid==='fabrica');
  var opts='<option value="">+ Agregar actividad del catálogo...</option>';
  var lastCat='';
  ACTS.forEach(function(a){
    if(usados[a.id]) return;
    var actFabrica=!!a.fab;
    if(esFabrica!==actFabrica) return; // no mezclar: tienda ↔ fábrica
    if(a.cat!==lastCat){ if(lastCat)opts+='</optgroup>'; opts+='<optgroup label="'+a.cat+'">'; lastCat=a.cat; }
    opts+='<option value="'+a.id+'">'+esc(a.name)+'</option>';
  });
  if(lastCat)opts+='</optgroup>';
  html+='<div class="addbar">'+
    '<select id="addSel">'+opts+'</select>'+
    '<button class="add-btn" onclick="addFromCatalog()">Agregar</button>'+
    '<button class="new-btn" onclick="addNueva()">＋ Nueva</button>'+
  '</div>';

  if(items.length===0){
    var tienePrecarga=(PRELOAD[sid]&&PRELOAD[sid].length>0);
    html+='<div class="empty">Esta tienda no tiene actividades cargadas.<br>Agregá con el dropdown de arriba'+(tienePrecarga?', o cargá su lista base:':'.')+
      (tienePrecarga?'<br><br><button style="padding:11px 16px;border:none;border-radius:10px;background:var(--green);color:#fff;font-family:Inter,sans-serif;font-weight:700;font-size:0.82rem;cursor:pointer" onclick="cargarPrecarga(\''+sid+'\')">↺ Cargar tareas base de '+esc(store.name)+'</button>':'')+
    '</div>';
  } else {
    var catsPresentes=[];
    CAT_ORDER.forEach(function(c){ catsPresentes.push(c); });
    items.forEach(function(it){ if(catsPresentes.indexOf(it.cat)<0) catsPresentes.push(it.cat); });
    catsPresentes.forEach(function(cat){
      var catItems=items.filter(function(it){return it.cat===cat;});
      if(catItems.length===0) return;
      html+='<div class="cat-title">'+cat+'</div>';
      catItems.forEach(function(it){
        var obsOpen=openObs[sid+'_'+it.key];
        html+='<div class="act-card st-'+it.st+'">'+
          '<button class="rm-btn" title="Quitar" onclick="removeItem(\''+sid+'\',\''+it.key+'\')">×</button>'+

/* ====================== HISTORIAL ====================== */
var histF={store:'',from:'',to:''};
function histMatch(h){
  if(histF.store && h.storeId!==histF.store) return false;
  if(histF.from && (h.fecha||'')<histF.from) return false;
  if(histF.to && (h.fecha||'')>histF.to) return false;
  return true;
}
function histFilteredEntries(){
  return historial.filter(histMatch).slice().sort(function(a,b){
    var fa=a.fecha||'', fb=b.fecha||'';
    if(fa!==fb) return fa<fb?1:-1;            // por fecha: la más nueva primero
    return (''+a.id<''+b.id)?1:-1;            // misma fecha: por orden de registro
  });
}
function setHistStore(v){ histF.store=v; renderHistorial(); }
function setHistFrom(v){ histF.from=v; renderHistorial(); }
function setHistTo(v){ histF.to=v; renderHistorial(); }
function clearHistF(){ histF={store:'',from:'',to:''}; renderHistorial(); }

function renderHistorial(){
  var entries=histFilteredEntries();
  var rows=[];
  entries.forEach(function(h){ (h.items||[]).forEach(function(it){ rows.push({fecha:h.fechaLbl,hora:h.hora||'',tienda:h.storeName,act:it.name,cat:it.cat,st:it.st,obs:it.obs}); }); });
  var badge={realizado:'<span class="hb r">Realizado</span>',pendiente:'<span class="hb p">Pendiente</span>',na:'<span class="hb n">No aplica</span>'};
  var hayFiltro=!!(histF.store||histF.from||histF.to);
  var storeOpts='<option value="">🏬 Todas las tiendas</option>';
  STORES.forEach(function(s){ storeOpts+='<option value="'+s.id+'"'+(histF.store===s.id?' selected':'')+'>'+esc(s.name)+'</option>'; });

  var html='<div class="chart-card">'+
    '<div class="chart-title">🗂️ Historial</div>'+
    '<div style="display:flex;flex-direction:column;gap:8px;margin-bottom:12px">'+
      '<select onchange="setHistStore(this.value)" style="padding:9px;border:1px solid var(--border2);border-radius:9px;font-family:Inter,sans-serif;font-size:0.82rem;font-weight:700;background:#fff;cursor:pointer">'+storeOpts+'</select>'+
      '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">'+
        '<label style="font-size:0.72rem;color:var(--muted);font-weight:700">Desde</label>'+
        '<input type="date" value="'+(histF.from||'')+'" onchange="setHistFrom(this.value)" style="flex:1;min-width:120px;padding:8px;border:1px solid var(--border2);border-radius:9px;font-family:Inter,sans-serif;font-size:0.8rem">'+
        '<label style="font-size:0.72rem;color:var(--muted);font-weight:700">Hasta</label>'+
        '<input type="date" value="'+(histF.to||'')+'" onchange="setHistTo(this.value)" style="flex:1;min-width:120px;padding:8px;border:1px solid var(--border2);border-radius:9px;font-family:Inter,sans-serif;font-size:0.8rem">'+
      '</div>'+
      (hayFiltro?'<button class="mini-btn" style="background:var(--na-bg);color:var(--muted);align-self:flex-start" onclick="clearHistF()">✕ Limpiar filtros</button>':'')+
    '</div>'+
    '<div style="font-size:0.75rem;color:var(--muted);margin-bottom:10px">'+rows.length+' actividad(es) · '+entries.length+' registro(s)'+(hayFiltro?' <b style="color:var(--green-dark)">(filtrado)</b>':'')+'</div>';

  if(rows.length===0){
    html+='<div style="font-size:0.85rem;color:var(--muted)">'+(hayFiltro?'No hay registros con esos filtros. Probá cambiar la tienda o las fechas.':'Todavía no hay registros. Registrá el mantenimiento de una tienda y aparece acá.')+'</div>';
  } else {
    html+='<div style="display:flex;gap:8px;margin-bottom:12px">'+
      '<button class="mini-btn" style="background:var(--green);color:#fff;flex:1" onclick="exportarExcel()">📤 Exportar / Compartir'+(hayFiltro?' (filtrado)':'')+'</button>'+
    '</div>';
    html+='<div style="overflow-x:auto"><table class="hist-table"><thead><tr>'+
      '<th>Fecha</th><th>Tienda</th><th>Actividad</th><th>Estado</th></tr></thead><tbody>';
    rows.forEach(function(r){
      html+='<tr>'+
        '<td class="dt">'+r.fecha+'<br><span style="font-size:0.62rem">'+r.hora+'</span></td>'+
        '<td style="font-weight:600">'+esc(r.tienda)+'</td>'+
        '<td>'+esc(r.act)+(r.obs?'<br><span style="font-size:0.64rem;color:var(--muted)">📝 '+esc(r.obs)+'</span>':'')+'</td>'+
        '<td>'+(badge[r.st]||r.st)+'</td>'+

  var n=historial.length;

  // Doble seguridad: hay que escribir BORRAR (un toque accidental no lo hace).
  var t=prompt('⚠️ Esto BORRA los '+n+' registro(s) del historial de TODOS los dispositivos y NO se puede deshacer.\n\nSi estás seguro, escribí:  BORRAR');
  if(t===null) return;
  if(t.trim().toUpperCase()!=='BORRAR'){ showToast('Cancelado (no escribiste BORRAR)'); return; }
  historial=[]; saveHist(); renderHistorial();
  showToast('Historial vaciado');
}
function exportarExcel(){
  if(typeof XLSX==='undefined'){ showToast('No cargó Excel (revisá internet)'); return; }
  var rows=[['Fecha','Hora','Tienda','Categoría','Actividad','Estado','Observación']];
  var estLbl={realizado:'Realizado',pendiente:'Pendiente',na:'No aplica'};
  histFilteredEntries().forEach(function(h){
    h.items.forEach(function(it){
      rows.push([h.fechaLbl,h.hora||'',h.storeName,it.cat,it.name,estLbl[it.st]||it.st,it.obs||'']);
    });
  });
  var ws=XLSX.utils.aoa_to_sheet(rows);
  ws['!cols']=[{wch:11},{wch:7},{wch:16},{wch:22},{wch:40},{wch:12},{wch:30}];
  var wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Historial');
  var fname='Mantenimiento_KrispyKreme_'+new Date().toISOString().slice(0,10)+'.xlsx';
  var out=XLSX.write(wb,{bookType:'xlsx',type:'array'});
  var blob=new Blob([out],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  // En el celular: abrir el menú Compartir (mandar a Sheets/Drive/WhatsApp/mail).
  try{
    var file=new File([blob],fname,{type:blob.type});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      navigator.share({files:[file],title:'Historial de mantenimiento'})
        .then(function(){ showToast('Compartido ✓'); })
        .catch(function(){ descargarBlob(blob,fname); });
      return;
    }
  }catch(e){}
  descargarBlob(blob,fname);
}
function descargarBlob(blob,fname){
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a'); a.href=url; a.download=fname; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(url); if(a.parentNode) a.parentNode.removeChild(a); },600);
  showToast('Excel descargado ✓');
}

/* Efecto hero: parallax del fondo + nombre de la tienda que se condensa en la barra al bajar */
(function(){
  var tb=document.querySelector('.topbar .title');
  var baseTitle=tb?tb.innerHTML:'';
  var condensed=false, ticking=false;
  function onScroll(){
    if(ticking) return; ticking=true;
    requestAnimationFrame(function(){
      ticking=false;
      var sc=window.scrollY||document.documentElement.scrollTop||0;
      var hero=document.querySelector('.store-head');
      if(hero && currentView==='store'){
        hero.style.setProperty('--par', (sc*0.4)+'px');        // el fondo baja más lento (parallax)
        hero.style.opacity=Math.max(0.35, 1 - sc/300);          // el hero se desvanece suave
        var nm=(STORES.filter(function(s){return s.id===currentStore;})[0]||{}).name||'';
        if(sc>120 && !condensed){ condensed=true; if(tb) tb.innerHTML='<span>Mantenimiento</span>'+esc(nm); }
        else if(sc<=120 && condensed){ condensed=false; if(tb) tb.innerHTML=baseTitle; }
      } else if(condensed){ condensed=false; if(tb) tb.innerHTML=baseTitle; }
    });
  }
  window.addEventListener('scroll', onScroll, {passive:true});
})();

    if(s==='connected'){ pill.textContent='🟢 Sincronizado'; pill.style.background='#059669'; }
    else if(s==='readonly'){ pill.textContent='👁️ Solo lectura'; pill.style.background='#2563eb'; }
    else if(s==='connecting'){ pill.textContent='⏳ Conectando...'; pill.style.background='#d97706'; }
    else if(s==='offline'){ pill.textContent='🟠 Sin conexión'; pill.style.background='#d97706'; }
    else if(s==='error'){ pill.textContent='🔴 Error de sincronización'; pill.style.background='#dc2626'; }
    else { pill.textContent='⚪ Sin conectar'; pill.style.background='#475569'; }
  }
  function makePill(){
    pill=document.createElement('button'); pill.className='pill'; pill.style.cursor='pointer';
    pill.title='Tocá para cerrar sesión / cambiar clave';
    pill.onclick=confirmLogout;
    document.body.appendChild(pill); setStatus('connecting');
  }
  function confirmLogout(){
    if(!confirm('¿Cerrar sesión? Vas a tener que ingresar la clave de nuevo.')) return;
    try{ localStorage.removeItem('mant_pw'); }catch(e){}
    if(typeof firebase!=='undefined'&&firebase.auth){ firebase.auth().signOut().then(function(){location.reload();}).catch(function(){location.reload();}); }
    else location.reload();
  }

  function serialize(){ return { v:1,_ts:Date.now(),_writer:clientId, state:state, historial:historial }; }
  function applyData(o){
    if(!o||typeof o!=='object') return;
    applyingRemote=true;
    if(o.state){ state=normalizeState(o.state); try{localStorage.setItem(STATE_KEY,JSON.stringify(state));}catch(e){} }
    historial=toArray(o.historial); try{localStorage.setItem(HIST_KEY,JSON.stringify(historial));}catch(e){}
    applyingRemote=false;
    render(); if(typeof refreshChrome==='function') refreshChrome();
  }
  function pushData(){ if(!ref||applyingRemote) return; try{ ref.set(serialize()); }catch(e){ setStatus('error'); } }
  function schedulePush(){ if(!ref) return; clearTimeout(writeTimer); writeTimer=setTimeout(pushData,300); }
  function revertLocal(){ if(lastRemoteJSON){ try{ applyData(JSON.parse(lastRemoteJSON)); return; }catch(e){} } render(); }

  ['saveState','saveHist'].forEach(function(name){
    var orig=window[name]; if(typeof orig!=='function') return;
    window[name]=function(){
      var r=orig.apply(this,arguments);
      if(applyingRemote) return r;
      if(role==='reader'){ revertLocal(); if(typeof showToast==='function') showToast('Modo solo lectura: no podés editar'); return r; }
      schedulePush(); return r;
    };
  });

  function showLogin(){
    if(loginBox||(firebase.auth().currentUser)) return;
    loginBox=document.createElement('div');
    loginBox.style.cssText='position:fixed;inset:0;background:rgba(15,23,42,0.82);z-index:100000;display:flex;align-items:center;justify-content:center;padding:20px';
    loginBox.innerHTML='<div style="background:#fff;border-radius:16px;padding:26px;max-width:340px;width:100%;font-family:Inter,sans-serif;box-shadow:0 10px 40px rgba(0,0,0,0.35)">'
      +'<div style="font-weight:800;font-size:1.1rem;color:#1a1f2e;margin-bottom:6px">Mantenimiento - Krispy Kreme</div>'
      +'<div style="font-size:0.85rem;color:#6b7280;margin-bottom:18px">Ingresá tu clave para entrar.</div>'
      +'<input id="mpw" type="password" placeholder="Clave" autocomplete="current-password" style="width:100%;box-sizing:border-box;padding:12px;border:1px solid #e2e6ed;border-radius:10px;font-size:1rem;font-family:Inter,sans-serif;margin-bottom:10px">'
      +'<div id="merr" style="color:#dc2626;font-size:0.8rem;margin-bottom:10px;display:none">Clave incorrecta. Probá de nuevo.</div>'
      +'<button id="mbtn" style="width:100%;padding:12px;border:none;border-radius:10px;background:#17a06a;color:#fff;font-weight:700;font-size:1rem;font-family:Inter,sans-serif;cursor:pointer">Entrar</button>'
      +'</div>';
    document.body.appendChild(loginBox);
    var inp=loginBox.querySelector('#mpw'),btn=loginBox.querySelector('#mbtn'),err=loginBox.querySelector('#merr');
    var MAX_INTENTOS=5, BLOQUEO_MIN=5;
    function bloqueoHasta(){ return parseInt(localStorage.getItem('mant_lockUntil')||'0',10); }
    function verBloqueo(){ var lu=bloqueoHasta(); if(Date.now()<lu){ var m=Math.ceil((lu-Date.now())/60000); err.textContent='🔒 Demasiados intentos. Esperá '+m+' min.'; err.style.display='block'; btn.disabled=true; return true; } btn.disabled=false; return false; }
    function attempt(){
      if(verBloqueo()) return;
      var pw=inp.value; if(!pw) return;
      btn.textContent='Entrando...'; btn.disabled=true; err.style.display='none';
      signIn(pw,function(){
        btn.textContent='Entrar'; btn.disabled=false;
        var f=parseInt(localStorage.getItem('mant_fails')||'0',10)+1;
        if(f>=MAX_INTENTOS){
          try{ localStorage.setItem('mant_lockUntil', Date.now()+BLOQUEO_MIN*60000); localStorage.setItem('mant_fails','0'); }catch(e){}
          err.textContent='🔒 Demasiados intentos. Bloqueado '+BLOQUEO_MIN+' min.'; btn.disabled=true;
        } else {
          try{ localStorage.setItem('mant_fails', f); }catch(e){}
          err.textContent='Clave incorrecta. Te quedan '+(MAX_INTENTOS-f)+' intento(s).';
        }
        err.style.display='block'; inp.value=''; inp.focus();
      });
    }
    btn.onclick=attempt; inp.onkeydown=function(e){ if(e.key==='Enter') attempt(); };
    verBloqueo(); // si ya estaba bloqueado, avisar al abrir
    setTimeout(function(){ inp.focus(); },100);
  }
  function hideLogin(){ if(loginBox&&loginBox.parentNode){ loginBox.parentNode.removeChild(loginBox); } loginBox=null; }
  function limpiarIntentos(){ try{ localStorage.removeItem('mant_fails'); localStorage.removeItem('mant_lockUntil'); }catch(e){} }
  function signIn(pw,onErr){
    firebase.auth().signInWithEmailAndPassword(AUTH_EMAIL_EDITOR,pw).then(function(){ try{localStorage.setItem('mant_pw',pw);}catch(e){} limpiarIntentos(); })
    .catch(function(){ firebase.auth().signInWithEmailAndPassword(AUTH_EMAIL_READER,pw).then(function(){ try{localStorage.setItem('mant_pw',pw);}catch(e){} limpiarIntentos(); })
      .catch(function(){ if(onErr) onErr(); }); });
  }

  function startDb(){
    if(dbStarted) return; dbStarted=true;
    try{ ref=firebase.database().ref('mant_data'); }catch(e){ setStatus('error'); return; }
    firebase.database().ref('.info/connected').on('value',function(snap){
      if(snap.val()===true){ setStatus(role==='reader'?'readonly':'connected'); } else setStatus('offline'); });
    ref.on('value',function(snap){
      setStatus(role==='reader'?'readonly':'connected'); // recibir datos = conectado y autorizado
      var o=snap.val();
      if(o===null){ if(role==='editor') pushData(); return; }
      if(o._writer===clientId) return;
      lastRemoteJSON=JSON.stringify(o); applyData(o);
    }, function(){ setStatus('error'); });
  }

  function start(){
    makePill();
    if(typeof firebase==='undefined'){ setStatus('error'); pill.textContent='🔴 No cargó Firebase (revisá internet)'; return; }
    try{ firebase.initializeApp(firebaseConfig); }catch(e){ setStatus('error'); return; }
    firebase.auth().onAuthStateChanged(function(user){
      if(user){ role=(user.email===AUTH_EMAIL_EDITOR)?'editor':'reader'; hideLogin(); startDb(); return; }
      var saved=null; try{ saved=localStorage.getItem('mant_pw'); }catch(e){}
      if(saved){ signIn(saved, showLogin); } else { showLogin(); }
    });
  }
  start();
})();
</script>
</body>
